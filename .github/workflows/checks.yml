name: checks

on:
  push:
  pull_request:

jobs:
  stdlib:
    # The definitions and the quick checks need only the standard library.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest
      - uses: actions/upload-artifact@v7
        with:
          name: test-log-py${{ matrix.python-version }}
          path: results/tests.txt

  full:
    # rdflib + owlrl checks, and the notebooks re-executed with nbmake.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: pytest --nbmake notebooks/
        env:
          PYTHONHASHSEED: "0"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: executed-notebooks-and-logs
          path: |
            notebooks/*.ipynb
            results/*.txt
